{% extends "base.html" %}
{% block title %}직원 로그인{% endblock %}
{% block styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
{% endblock %}
{% block layout %}
<main class="login-page">
  <div class="login-brand">
    <img src="{{ url_for('static', filename='malgyeol-tm.png') }}" width="2172" height="724" alt="말결 TM">
    <div class="login-art" aria-hidden="true">
      <span class="login-incoming"></span>
      <span class="login-reply"></span>
    </div>
    <p>상담 데스크</p>
  </div>
  <section class="login-access" aria-labelledby="login-title">
    <div class="login-panel">
      <h1 id="login-title">직원 로그인</h1>
      <p class="sub">발급받은 직원 계정으로 상담 데스크에 접속하세요.</p>
      <form method="post" action="{{ url_for('login') }}" data-action="login" class="stack">
        <label>직원 아이디
          <input name="login_id" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required autofocus>
        </label>
        <label>비밀번호
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <button class="primary" type="submit">로그인</button>
      </form>
      <div class="login-customer">
        <span>상담을 요청한 고객이신가요?</span>
        <a href="{{ url_for('inquiry_page') }}">고객 문의하기 <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>
</main>
{% endblock %}
