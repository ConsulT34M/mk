{% extends "base.html" %}
{% block title %}직원 로그인{% endblock %}
{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='desk-operations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
{% endblock %}
{% block layout %}
<div class="login-page">
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}" aria-label="말결 TM 홈">말결 <span>TM</span></a>
    <div class="topbar-inner"><span class="product">
      <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='staff-icons.svg') }}#screen"></use></svg>상담 데스크
    </span></div>
  </header>
  <main class="login-access">
    <section class="login-panel" aria-labelledby="login-title">
      <header class="login-caption">
        <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='staff-icons.svg') }}#person"></use></svg>
        <h1 id="login-title">직원 로그인</h1>
      </header>
      <div class="login-content">
        <p id="login-help">발급받은 직원 계정으로 상담 데스크에 접속하세요.</p>
        <form method="post" action="{{ url_for('login') }}" data-action="login" aria-describedby="login-help">
          <div class="login-fields">
            <label for="login-id">직원 아이디</label>
            <div><input id="login-id" name="login_id" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required autofocus></div>
            <label for="login-password">비밀번호</label>
            <div><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
          </div>
          {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
          <button class="admin-primary login-submit" type="submit">로그인</button>
        </form>
      </div>
      <div class="login-customer">
        <span>상담을 요청한 고객이신가요?</span>
        <a href="{{ url_for('inquiry_page') }}">고객 문의하기 <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
</div>
{% endblock %}
