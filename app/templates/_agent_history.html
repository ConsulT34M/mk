<table class="admin-table"><thead><tr><th>접수 일시</th><th>상담 번호</th><th>채널</th><th>문의 유형</th><th>처리 결과</th></tr></thead><tbody>
{% for item in recent_cases %}<tr>
  <td><time datetime="{{ item.opened_at }}">{{ item.opened_at[:16]|replace('T',' ') }}</time></td>
  <td><a class="case-ref" href="{{ url_for('detail_page',case_id=item.case_id) }}">#{{ item.case_id[:8]|upper }}</a></td>
  <td>{{ '채팅' if item.channel=='WEB' else '통화' }}</td><td>{{ topic_names.get(item.inquiry_type,'미분류') }}</td>
  <td>{{ outcome_names.get(item.outcome,'미기록') }}</td>
</tr>{% else %}<tr><td colspan="5" class="admin-empty">종결한 상담이 없습니다.</td></tr>{% endfor %}
</tbody></table>
