server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/local-tls/cert.pem;
    ssl_certificate_key /etc/nginx/local-tls/key.pem;
    access_log off;
    server_tokens off;
    # Flask enforces the configured upload limit while receiving the request.
    client_max_body_size 0;
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
