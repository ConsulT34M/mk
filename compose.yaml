services:
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8443}:443"
    volumes:
      - tls:/etc/nginx/local-tls
    depends_on:
      app:
        condition: service_healthy
  app:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: tm_portal
      MYSQL_USER: tm_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python setup_demo.py first}
      PARTNER_TOKEN: ${PARTNER_TOKEN:?Run python setup_demo.py first}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-}
      OPENAI_CALL_SUMMARY_MODEL: ${OPENAI_CALL_SUMMARY_MODEL:-gpt-audio-1.5}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run python setup_demo.py first}
      DEMO_AGENT1_PASSWORD: ${DEMO_AGENT1_PASSWORD:?Run python setup_demo.py first}
      DEMO_AGENT2_PASSWORD: ${DEMO_AGENT2_PASSWORD:?Run python setup_demo.py first}
      STAFF_SESSION_MINUTES: ${STAFF_SESSION_MINUTES:-30}
      CHAT_SESSION_MINUTES: ${CHAT_SESSION_MINUTES:-60}
      ENTRY_CODE_MINUTES: ${ENTRY_CODE_MINUTES:-5}
      WAV_MAX_MIB: ${WAV_MAX_MIB:-10}
      S3_RECORDING_BUCKET: ${S3_RECORDING_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      CASE_RETENTION_MINUTES: ${CASE_RETENTION_MINUTES:-5}
    volumes:
      - recordings:/var/lib/tm-recordings
      - ${RECORDINGS_PATH:-./.local/recordings}:/var/lib/tm-recordings/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 10
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tm_portal
      MYSQL_USER: tm_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python setup_demo.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python setup_demo.py first}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM staff_account LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 45

volumes:
  mysql-data:
  recordings:
  tls:
